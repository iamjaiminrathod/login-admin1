<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Admin Login</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #4D5361; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-box {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 4px;
            width: 320px;
            box-shadow: 20px 20px 50px rgba(0, 0, 0, 0.2); /* Soft shadow like image */
            position: relative;
            z-index: 10;
        }

        h2 {
            font-weight: 400;
            color: #333;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        h2 strong {
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E2E8F0; /* Exact border color */
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #1ABC9C;
        }

        .forgot-password {
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #1ABC9C;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.3s;
            overflow: hidden;
        }

        .submit-btn:hover {
            background-color: #16a085;
        }

        .submit-btn .btn-text {
            color: white;
            letter-spacing: 0.5px;
            visibility: visible;
        }

        .btn-loader {
            display: none; /* Initially hidden */
            position: absolute;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff; /* Spinning part */
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: #333;
        }

        .register-link a {
            color: #333;
            text-decoration: none;
        }

        .video-container {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Login Form -->
    <div class="login-box" id="loginBox">
        <h2><strong>Admin Login</strong></h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">SUBMIT</span>
                <span class="btn-loader" id="btnLoader"></span>
            </button>
            <div class="register-link">
                Don't have login? <a href="#">Register</a>
            </div>
        </form>
    </div>

    <div id="videoContainer" class="video-container">
        <video id="prankVideo" src="https://archive.org/download/screen-recording-05-02-2026-17-50-45-1/ScreenRecording_05-02-2026%2017-50-45_1.mov" preload="auto"></video>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginBox = document.getElementById('loginBox');
        const videoContainer = document.getElementById('videoContainer');
        const prankVideo = document.getElementById('prankVideo');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = submitBtn.querySelector('.btn-text');
        const btnLoader = document.getElementById('btnLoader');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); 

            submitBtnText.style.visibility = 'hidden';
            btnLoader.style.display = 'inline-block';
            submitBtn.disabled = true; 

            setTimeout(() => {
                const passwordInput = document.getElementById('password').value;
                const correctPassword = "admin";

                submitBtnText.style.visibility = 'visible';
                btnLoader.style.display = 'none';
                submitBtn.disabled = false;

                if (passwordInput === correctPassword) {
                    
                    alert("Login successful! Welcome to Admin.");
                } else {
                    loginBox.style.display = "none"; 
                    videoContainer.style.display = "block"; 
                    
                  if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen();
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                    } else if (videoContainer.msRequestFullscreen) {
                        videoContainer.msRequestFullscreen();
                    }

                    prankVideo.play();
                }
            }, 2000);

        });
        prankVideo.addEventListener('ended', function() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else if (document.webkitFullscreenElement) {
                document.webkitExitFullscreen();
            } else if (document.msFullscreenElement) {
                document.msExitFullscreen();
            }
            videoContainer.style.display = "none";
            loginBox.style.display = "block";
            document.getElementById('password').value = "";
        });
    </script>

</body>
</html>
